spring.application.name=libreria-pos-system
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/libreria_db?useSSL=false&serverTimezone=America/El_Salvador&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:doq0aezh4}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

jwt.secret=${JWT_SECRET}

resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:no-reply@barberisrael.com}

wompi.public.key=${WOMPI_PUBLIC_KEY}
wompi.private.key=${WOMPI_PRIVATE_KEY}
wompi.base.url=https://api-sandbox.wompi.sv/v1

whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone_id=${WHATSAPP_PHONE_ID:}
whatsapp.base_url=https://graph.facebook.com/v19.0

spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1